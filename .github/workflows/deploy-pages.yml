name: Deploy to GitHub Pages

on:
  # Automatically deploy on push to main or master branch
  push:
    branches:
      - main
      - master

  # Allow manual deployment from the GitHub Actions tab
  workflow_dispatch:

# Required permissions for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment without cancelling an in-progress run
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build static site with Vite
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: |
          if [ -z "$BASE_PATH" ]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="${BASE_PATH%/}/"
          fi
          echo "Building for GitHub Pages with VITE_BASE_PATH=$VITE_BASE_PATH"
          npm run build:pages

      - name: Prepare static artifacts (.nojekyll, SPA fallback & LaMetric icon library)
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html
          if [ -d data/lametric ]; then
            mkdir -p dist/data/lametric
            cp -r data/lametric/. dist/data/lametric/
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
