<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ESP32 配网</title>
<style>
:root{--bg:#FFF8F0;--card:#fff;--line:rgba(255,107,107,.15);--line2:rgba(255,107,107,.07);--txt:#2D3436;--sub:#636E72;--sub2:#B2BEC3;--blue:#FF6B6B;--grad:linear-gradient(135deg,#FF6B6B,#FFA07A);--ok:#4ECDC4;--err:#FF6B6B;--sh:0 4px 20px rgba(255,107,107,.12);--shl:0 8px 30px rgba(255,107,107,.16)}
*{box-sizing:border-box;margin:0;padding:0}
html{overflow-x:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#FFF8F0,#FFE5D9);background-attachment:fixed;color:var(--txt);line-height:1.5;min-height:100vh;min-height:100dvh;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(255,107,107,.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,107,107,.03) 1px,transparent 1px);background-size:20px 20px;pointer-events:none;z-index:-1}
button{font-family:inherit;cursor:pointer;color:inherit}
input{font-family:inherit}
.app{max-width:520px;margin:0 auto;padding:18px 16px;display:grid;grid-template-rows:auto auto 1fr auto;gap:14px;min-height:100vh;min-height:100dvh}
.hd{display:flex;align-items:center;justify-content:center;gap:10px}
.brand{display:grid;justify-items:center;gap:2px;text-align:center}
.brand h1{font-size:20px;font-weight:800;line-height:1.2;background:linear-gradient(135deg,#FF6B6B,#FFA07A);-webkit-background-clip:text;background-clip:text;color:transparent}

.wz{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;box-shadow:0 4px 16px rgba(255,107,107,.06)}
.ws{display:grid;grid-template-columns:auto 1fr;gap:7px;align-items:center;min-width:0}
.ws i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:11.5px;font-weight:700;background:#fdf0ec;color:#d9a09a;flex:none;transition:all .25s}
.ws span{font-size:12px;font-weight:550;color:var(--sub2);white-space:nowrap;transition:color .25s}
.ws.done i{background:var(--ok);color:#fff}
.ws.done span{color:var(--sub)}
.ws.act i{background:var(--grad);color:#fff;box-shadow:0 4px 10px rgba(255,107,107,.35)}
.ws.act span{color:var(--txt)}
.wl{width:16px;height:2px;background:var(--line);margin:0 6px}
main{display:grid;gap:14px;align-content:start}
.view{display:none;gap:14px}
.view.on{display:grid;animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--sh)}
h2{font-size:14px}
.sub{font-size:12px;color:var(--sub)}
.btn{display:block;width:100%;border:none;border-radius:13px;background:var(--grad);color:#fff;font-size:14px;font-weight:700;padding:10px;box-shadow:0 8px 20px rgba(255,107,107,.3);transition:transform .15s,box-shadow .15s}
.btn:hover{box-shadow:0 10px 26px rgba(255,107,107,.4)}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--sub);font-weight:600;box-shadow:none;padding:9px}
.btn.ghost:hover{color:var(--txt);border-color:var(--blue)}
.btn.sm{display:inline-block;width:auto;padding:7px 13px;font-size:12px;border-radius:10px;box-shadow:none}
.link{display:block;width:100%;background:none;border:none;color:var(--blue);font-size:13px;font-weight:600;padding:8px;text-align:center}
.wifi{position:relative;display:inline-block;width:28px;height:24px;color:var(--blue);flex:none}
.wifi i{position:absolute;left:50%;top:9px;transform:translateX(-50%);box-sizing:border-box;border:2.5px solid transparent;border-top-color:var(--sub2);border-radius:50%}
.wifi i:nth-child(1){width:9px;height:9px}.wifi i:nth-child(2){width:15px;height:15px}.wifi i:nth-child(3){width:21px;height:21px}.wifi i:nth-child(4){width:27px;height:27px}
.wifi b{position:absolute;left:50%;bottom:2px;transform:translateX(-50%);width:5px;height:5px;border-radius:50%;background:var(--sub2)}
.wifi.s1 i:nth-child(1){border-top-color:currentColor}.wifi.s1 b{background:currentColor}
.wifi.s2 i:nth-child(-n+2){border-top-color:currentColor}.wifi.s2 b,.wifi.s3 b,.wifi.s4 b{background:currentColor}
.wifi.s3 i:nth-child(-n+3){border-top-color:currentColor}.wifi.s4 i:nth-child(-n+4){border-top-color:currentColor}
.wifi.lg{width:36px;height:30px}.wifi.lg i{top:11px}
.sel-head{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;padding:16px;border-radius:18px;background:var(--grad);color:#fff;box-shadow:var(--shl)}
.sel-head h2{color:#fff}
.sel-head p{font-size:12px;color:rgba(255,255,255,.85);margin-top:1px}
.sel-head .btn.sm{border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.sel-head .btn.sm:disabled{opacity:.6}
.list-card{padding:10px}
#list{height:300px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:rgba(255,107,107,.35) transparent}
#list::-webkit-scrollbar{width:4px}
#list::-webkit-scrollbar-track{background:transparent}
#list::-webkit-scrollbar-thumb{background:rgba(255,107,107,.35);border-radius:99px}
#list::-webkit-scrollbar-thumb:hover{background:rgba(255,107,107,.55)}
#list:empty{height:0}
.lhd{display:grid;grid-template-columns:1fr auto;align-items:center;padding:6px 8px 8px}
.lhd span{font-size:13px;font-weight:700}
.lhd b{font-size:11px;font-weight:600;color:var(--sub);background:var(--bg);border:1px solid var(--line);padding:2px 10px;border-radius:99px}
.item{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:12px;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid var(--line2);padding:10px 7px;opacity:0;animation:fadeUp .3s ease forwards;border-radius:12px;transition:background .15s}
.item:last-child{border-bottom:0}
.item:hover{background:#FFF5F2}
.item .nm{font-weight:550;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .mt{font-size:11px;color:var(--sub)}
.item .ob{font-size:10.5px;font-weight:700;color:var(--ok);background:rgba(78,205,196,.12);border:1px solid rgba(78,205,196,.35);padding:2px 8px;border-radius:99px}
.item .chev{font-style:normal;font-size:19px;color:var(--sub2);font-weight:700;transition:transform .15s}
.item:hover .chev{transform:translateX(2px);color:var(--blue)}
.lock{width:13px;height:14px;color:var(--sub2)}
.manual{padding:14px}
.manual label{display:grid;gap:6px;font-size:12px;font-weight:600;color:var(--sub);margin-bottom:12px}
input[type=text],input[type=password]{width:100%;padding:9px 12px;border-radius:11px;border:1.5px solid var(--line);background:#FAFAFA;color:var(--txt);font-size:16px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(255,107,107,.12)}
.pwdwrap{position:relative}
.pwdwrap input{padding-right:56px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--blue);font-size:12px;font-weight:600;padding:6px 8px}
.ncard{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:14px;padding:14px 16px;border-radius:18px}
.ninfo{min-width:0}.ninfo h2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pwd-card{display:grid;gap:0}
.pwd-card .btn{margin-top:6px}
.err{color:var(--err);font-size:12px;font-weight:600;margin:2px 0 8px}
.pwd-tip{display:grid;grid-template-columns:auto 1fr;gap:9px;align-items:center;font-size:12px;color:var(--sub);padding:10px 12px;border-radius:11px;background:var(--bg);margin-bottom:12px}
.pwd-tip i{width:18px;height:18px;border-radius:50%;background:rgba(78,205,196,.15);color:var(--ok);display:grid;place-items:center;font-style:normal;font-size:11px;font-weight:800}
.c-card{display:grid;justify-items:center;gap:12px;padding:26px 18px}
.cring{position:relative;width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--blue) 0deg,var(--line) 0deg);display:grid;place-items:center;transition:background .4s}
.cring::before{content:"";position:absolute;inset:10px;background:var(--card);border-radius:50%;box-shadow:inset 0 0 0 1px var(--line)}
.cring .wifi,.cring .tick{position:relative;z-index:1}
.cring .wifi{width:38px;height:32px}.cring .wifi i{top:12px}
.tick{font-size:38px;font-weight:800;color:var(--ok)}
.esteps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-width:340px}
.estep{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:center;padding:8px 10px;border-radius:11px;background:var(--bg);border:1px solid var(--line);font-size:11px;color:var(--sub);transition:all .3s}
.estep b{width:8px;height:8px;border-radius:50%;background:var(--sub2)}
.estep.act{border-color:rgba(255,107,107,.5);color:var(--txt);background:rgba(255,107,107,.07)}
.estep.act b{background:var(--blue);animation:blink 1s infinite}
.estep.done{border-color:rgba(78,205,196,.45);color:var(--ok);background:rgba(78,205,196,.07)}
.estep.done b{background:var(--ok)}
.ebox{width:100%;background:rgba(255,107,107,.08);border:1px solid rgba(255,107,107,.3);border-radius:12px;padding:12px}
.ebox p{color:var(--err);font-size:12.5px;font-weight:600;text-align:center;margin-bottom:10px}
.eacts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@keyframes blink{50%{opacity:.25}}
.done-card{display:grid;justify-items:center;gap:12px;padding:30px 18px}
.tickbig{width:92px;height:92px;margin-bottom:2px}
.tickbig .tc{fill:none;stroke:var(--ok);stroke-width:3;stroke-linecap:round;stroke-dasharray:152;stroke-dashoffset:152;animation:draw .6s ease forwards}
.tickbig .tm{fill:none;stroke:var(--ok);stroke-width:4;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:40;stroke-dashoffset:40;animation:draw .4s .55s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.done-card h2{font-size:21px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.okc{color:var(--ok)}
.icon-card{display:grid;gap:12px}
.icon-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.icon-card label{display:grid;gap:6px;font-size:12px;font-weight:600;color:var(--sub)}
.icon-card input,.icon-card select{width:100%;padding:9px 12px;border-radius:11px;border:1.5px solid var(--line);background:#FAFAFA;color:var(--txt);font-size:14px;outline:none}
.preview{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
#iconCanvas{width:96px;height:96px;image-rendering:pixelated;background:#111;border-radius:10px;border:1px solid var(--line)}
.mono{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:var(--sub);word-break:break-all}
.foot{font-size:10.5px;color:var(--sub2);text-align:center;padding-top:2px}
@media(max-width:380px){.app{padding:14px 12px}.ws span{display:none}.ws{grid-template-columns:auto}.wz{justify-content:space-between}.wl{margin:0 3px}}
</style>
</head>
<body>
<div class="app">
<header class="hd">
<div class="brand"><h1>NeoClock</h1></div>
</header>
<nav class="wz" id="wz">
<div class="ws" data-w="1"><i>1</i><span>选择网络</span></div><span class="wl"></span>
<div class="ws" data-w="2"><i>2</i><span>输入密码</span></div><span class="wl"></span>
<div class="ws" data-w="3"><i>3</i><span>配网完成</span></div>
</nav>
<main>
<section class="view" id="v1">
<div class="sel-head">
<span class="wifi lg s4"><i></i><i></i><i></i><i></i><b></b></span>
<div><h2>选择 WiFi 网络</h2><p id="scanInfo">正在扫描附近网络…</p></div>
<button class="btn sm" id="btnScan">刷新</button>
</div>
<div class="card list-card">
<div class="lhd"><span>附近网络</span><b id="scanCnt">--</b></div>
<div id="list"></div>
<p class="sub" id="empty" hidden style="text-align:center;padding:16px 0 6px">未扫描到网络，请刷新或手动输入</p>
<button class="link" id="btnManual">＋ 手动输入网络名称</button>
</div>
<div class="card manual" id="manual" hidden>
<label>网络名称<input type="text" id="mSsid" placeholder="输入 WiFi 名称" maxlength="32"></label>
<button class="btn" id="btnMNext">下一步</button>
</div>
</section>
<section class="view" id="v2">
<div class="card ncard">
<span class="wifi lg s4" id="pSig"><i></i><i></i><i></i><i></i><b></b></span>
<div class="ninfo"><h2 id="pSsid">--</h2><p class="sub" id="pMeta">--</p></div>
<button class="btn ghost sm" id="btnBack">返回</button>
</div>
<div class="card pwd-card">
<div class="pwd-tip" id="openTip" hidden><i>!</i><span>此网络为开放网络，无需输入密码</span></div>
<label style="font-size:12px;font-weight:600;color:var(--sub);display:grid;gap:6px;margin-bottom:12px">WiFi 密码
<span class="pwdwrap"><input type="password" id="pwd" placeholder="输入密码" maxlength="64" autocomplete="off"><button class="eye" id="btnEye" type="button">显示</button></span>
</label>
<p class="err" id="err" hidden></p>
<button class="btn" id="btnConn">连接网络</button>
</div>
</section>
<section class="view" id="v3">
<div class="card c-card">
<div class="cring" id="cring">
<span class="wifi s2" id="cIcon"><i></i><i></i><i></i><i></i><b></b></span>
<span class="tick" id="okMark" hidden>✓</span>
</div>
<h2 id="cTitle">正在连接…</h2>
<p class="sub" id="cDesc">写入配置</p>
<div class="esteps" id="esteps">
<div class="estep" data-s="0"><b></b><span>写入配置</span></div>
<div class="estep" data-s="1"><b></b><span>连接路由器</span></div>
<div class="estep" data-s="2"><b></b><span>验证网络</span></div>
</div>
<div class="ebox" id="ebox" hidden>
<p id="cErr">连接失败，请重试</p>
<div class="eacts"><button class="btn" id="btnRetry">重试</button><button class="btn ghost" id="btnEdit">修改密码</button></div>
</div>
</div>
</section>
<section class="view" id="v4">
<div class="card done-card">
<svg class="tickbig" viewBox="0 0 52 52"><circle class="tc" cx="26" cy="26" r="24"/><path class="tm" d="M14 27l8 8 16-17"/></svg>
<h2>配网成功</h2>
<p class="sub">设备已连接 <b class="okc" id="dSsid">--</b>，配置已保存</p>
<button class="link" id="btnAgain">为其他设备配网</button>
</div>
<div class="card icon-card">
<div><h2>图标转换器</h2><p class="sub">选择 PNG/GIF，浏览器转换为 NCI RGB565 并上传到设备。time 用于时间页，date 用于日期页。</p></div>
<label>图片文件<input type="file" id="iconFile" accept="image/png,image/gif,image/*"></label>
<div class="icon-grid">
<label>图标名称<select id="iconName"><option value="time">time</option><option value="date">date</option><option value="custom">custom</option></select></label>
<label>自定义名称<input type="text" id="iconCustom" placeholder="如 weather" maxlength="31" disabled></label>
</div>
<div class="icon-grid">
<label>宽度<input type="number" id="iconW" value="8" min="1" max="32"></label>
<label>高度<input type="number" id="iconH" value="8" min="1" max="8"></label>
</div>
<div class="icon-grid">
<label>帧数<input type="number" id="iconFrames" value="1" min="1" max="60"></label>
<label>帧间隔 ms<input type="number" id="iconFrameMs" value="120" min="30" max="5000"></label>
</div>
<div class="preview"><canvas id="iconCanvas" width="8" height="8"></canvas><div><p class="sub" id="iconInfo">未选择图片</p><p class="mono" id="iconResult"></p></div></div>
<button class="btn" id="btnIconConvert">转换并上传</button>
</div>
</section>
</main>
<footer class="foot">ESP32 配网 · v2.2 · 单文件零依赖</footer>
</div>
<script>
(function(){
var BASE="";
var ENC={0:"开放",2:"WPA",3:"WPA2",4:"WPA/WPA2"},SIG=["很弱","弱","中","强","极强"];
var LOCK='<svg class="lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2" fill="currentColor"/><path d="M8 11V7a4 4 0 0 1 8 0v4" fill="none" stroke="currentColor" stroke-width="2"/></svg>';
var S={nets:[],sel:null},VIEWS=["v1","v2","v3","v4"];
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function bars(r){return r>=-60?4:r>=-70?3:r>=-82?2:1}
function encName(e){return ENC[e]!==undefined?ENC[e]:"加密"}
function meta(n){return encName(n[2])+" · 信号"+SIG[bars(n[1])]+(n[3]?" · CH"+n[3]:"")}
function wifiCls(k){return '<span class="wifi s'+k+'"><i></i><i></i><i></i><i></i><b></b></span>'}
function show(v,w){
  var i,wz,k;
  for(i=0;i<VIEWS.length;i++)$(VIEWS[i]).className="view"+(VIEWS[i]===v?" on":"");
  wz=document.querySelectorAll("#wz .ws");
  for(k=0;k<3;k++)wz[k].className="ws"+(k+1<w?" done":k+1===w?" act":"");
  window.scrollTo(0,0);
}
function api(a,b,method){return new Promise(function(ok,no){
  var x=new XMLHttpRequest(),u=BASE+a;
  x.onload=function(){try{ok(JSON.parse(x.responseText))}catch(e){no(new Error("设备响应异常"))}};
  x.onerror=function(){no(new Error("无法连接设备，请确认已连接其热点"))};
  x.open(method||"GET",u,true);
  if(b){x.setRequestHeader("Content-Type","application/json");x.send(JSON.stringify(b));}else x.send();
})}
function scan(){
  var b=$("btnScan");b.disabled=true;$("scanInfo").textContent="正在扫描…";
  api("/scan").then(function(d){
    var ns=(d&&d.networks)||[],h="",i;
    S.nets=ns.filter(function(n){return n&&n.ssid}).map(function(n){return [n.ssid,n.rssi||-70,n.secure?3:0,n.channel||0]}).sort(function(a,b){return b[1]-a[1]});
    for(i=0;i<S.nets.length;i++)(function(n,j){
      var k=bars(n[1]),open=n[2]===0;
      h+='<button class="item" data-i="'+j+'" style="animation-delay:'+(j*35)+'ms">'+
         wifiCls(k)+
         '<span style="display:grid;gap:1px;min-width:0"><span class="nm">'+esc(n[0])+'</span><span class="mt">'+meta(n)+'</span></span>'+
         (open?'<b class="ob">开放</b>':LOCK)+
         '<i class="chev">›</i></button>';
    })(S.nets[i],i);
    $("list").innerHTML=h;
    $("empty").hidden=S.nets.length>0;
    $("scanCnt").textContent=S.nets.length+" 个网络";
    $("scanInfo").textContent="点击刷新重新扫描";
  }).catch(function(){
    $("scanCnt").textContent="扫描失败";$("empty").hidden=false;$("scanInfo").textContent="请重试";
  }).then(function(){b.disabled=false});
}
function pick(i){
  var n=S.nets[i];if(!n)return;S.sel=n;
  $("pSsid").textContent=n[0];
  $("pMeta").textContent=meta(n);
  $("pSig").className="wifi lg s"+bars(n[1]);
  $("openTip").hidden=n[2]!==0;
  $("pwd").value="";$("err").hidden=true;
  show("v2",2);setTimeout(function(){$("pwd").focus()},220);
}
function setStage(k,desc){
  var d=Math.round(k/3*360),st,i;
  $("cring").style.background="conic-gradient(var(--blue) "+d+"deg,var(--line) "+d+"deg)";
  $("cDesc").textContent=desc;
  st=document.querySelectorAll(".estep");
  for(i=0;i<3;i++)st[i].className="estep"+(i<k?" done":i===k?" act":"");
}
function goConnect(){
  var n=S.sel,open=S.sel&&S.sel[2]===0,pwd=$("pwd").value,steps=[["写入配置",0],["连接路由器",1],["验证网络",2]],stTimer=null;
  $("err").hidden=true;
  if(!open&&pwd.length<8){$("err").textContent="密码至少 8 位";$("err").hidden=false;return}
  $("okMark").hidden=true;$("cIcon").style.display="block";$("ebox").hidden=true;
  $("cTitle").textContent="正在连接…";setStage(0,"写入配置");
  show("v3",2);
  function run(k){
    if(k===3){
      if(stTimer){clearInterval(stTimer);stTimer=null}
      $("cring").style.background="var(--ok)";
      $("cIcon").style.display="none";$("okMark").hidden=false;
      $("cTitle").textContent="连接成功";$("cDesc").textContent="设备已接入互联网";
      setTimeout(done,800);return
    }
    setStage(steps[k][1],steps[k][0]);
    if(k===1){
      api("/connect",{ssid:n[0],password:pwd},"POST").then(function(d){
        if(!d||!d.ok){fail(new Error((d&&d.msg)||"连接请求失败"));return}
        setStage(2,"验证网络");
        if(stTimer)clearInterval(stTimer);
        stTimer=setInterval(function(){
          api("/status").then(function(d){
            if(d.state===2)run(3);
            else if(d.state===5){clearInterval(stTimer);stTimer=null;fail(new Error(d.message||"连接失败，请重试"))}
          }).catch(function(){});
        },2000);
      }).catch(fail);return
    }
    setTimeout(function(){run(k+1)},500);
  }
  function fail(e){
    if(stTimer){clearInterval(stTimer);stTimer=null}
    $("cring").style.background="rgba(255,107,107,.18)";$("cTitle").textContent="连接失败";
    $("cDesc").textContent="";$("cErr").textContent=e.message||"连接失败";
    $("ebox").hidden=false;
  }
  run(1);
}
function done(){
  var n=S.sel||["--"];$("dSsid").textContent=n[0];
  show("v4",3);
}

function u16le(a,v){a.push(v&255,(v>>8)&255)}
function rgb565(r,g,b){return ((r>>3)<<11)|((g>>2)<<5)|(b>>3)}
function iconTargetName(){var v=$('iconName').value;if(v==='custom')return $('iconCustom').value.trim();return v}
function validIconName(n){return /^[A-Za-z0-9_-]{1,31}$/.test(n)}
function drawCover(ctx,img,w,h,frame){ctx.clearRect(0,0,w,h);ctx.drawImage(img,0,0,w,h);var d=ctx.getImageData(0,0,w,h).data;frame.length=0;for(var i=0;i<w*h;i++){var r=d[i*4],g=d[i*4+1],b=d[i*4+2],a=d[i*4+3];frame.push(a<20?0:rgb565(r,g,b))}}
function makeNci(frames,w,h,frameMs){var bytes=[];bytes.push(78,67,73,49,w,h,frames.length,1);u16le(bytes,frameMs);u16le(bytes,0);frames.forEach(function(fr){fr.forEach(function(px){u16le(bytes,px)})});return new Uint8Array(bytes)}
function uploadNci(name,data){return new Promise(function(ok,no){var x=new XMLHttpRequest();x.onload=function(){if(x.status>=200&&x.status<300)ok(x.responseText);else no(new Error(x.responseText||('HTTP '+x.status)))};x.onerror=function(){no(new Error('上传失败'))};x.open('PUT',BASE+'/api/v1/icons/'+encodeURIComponent(name),true);x.setRequestHeader('Content-Type','application/octet-stream');x.send(data)})}
function sleepIcon(ms){return new Promise(function(r){setTimeout(r,ms)})}
function previewFrame(frame,w,h){var c=$('iconCanvas'),ctx=c.getContext('2d'),img=ctx.createImageData(w,h);c.width=w;c.height=h;for(var i=0;i<frame.length;i++){var v=frame[i],r=((v>>11)&31)*255/31,g=((v>>5)&63)*255/63,b=(v&31)*255/31;img.data[i*4]=r;img.data[i*4+1]=g;img.data[i*4+2]=b;img.data[i*4+3]=v?255:0}ctx.putImageData(img,0,0)}
function convertIcon(){var f=$('iconFile').files[0],name=iconTargetName(),w=+$('iconW').value||8,h=+$('iconH').value||8,fc=+$('iconFrames').value||1,fm=+$('iconFrameMs').value||120;if(!f){$('iconResult').textContent='请选择图片';return}if(!validIconName(name)){$('iconResult').textContent='名称只能使用字母数字 _ -';return}w=Math.max(1,Math.min(32,w));h=Math.max(1,Math.min(8,h));fc=Math.max(1,Math.min(60,fc));fm=Math.max(30,Math.min(5000,fm));var url=URL.createObjectURL(f),img=new Image();img.onload=function(){(async function(){var off=document.createElement('canvas'),ctx=off.getContext('2d'),frames=[];off.width=w;off.height=h;$('iconResult').textContent='正在采样 '+fc+' 帧...';for(var i=0;i<fc;i++){var fr=[];drawCover(ctx,img,w,h,fr);frames.push(fr);if(fc>1)await sleepIcon(fm)}previewFrame(frames[0],w,h);var nci=makeNci(frames,w,h,fm);$('iconInfo').textContent=name+' · '+w+'x'+h+' · '+fc+'帧 · '+nci.length+' bytes';$('iconResult').textContent='正在上传...';uploadNci(name,nci).then(function(){$('iconResult').textContent='上传成功：/api/v1/icons/'+name}).catch(function(e){$('iconResult').textContent=e.message});URL.revokeObjectURL(url)})()};img.onerror=function(){$('iconResult').textContent='图片读取失败';URL.revokeObjectURL(url)};img.src=url}

$("btnScan").onclick=scan;
$("list").onclick=function(e){var it=e.target.closest(".item");if(it)pick(+it.dataset.i)};
$("btnManual").onclick=function(){$("manual").hidden=!$("manual").hidden;if(!$("manual").hidden)$("mSsid").focus()};
$("btnMNext").onclick=function(){var s=$("mSsid").value.trim();if(!s)return;$("manual").hidden=true;S.nets=[[s,0,3]];pick(0)};
$("btnBack").onclick=function(){show("v1",1)};
$("btnEye").onclick=function(){var p=$("pwd"),s=p.type==="password";p.type=s?"text":"password";this.textContent=s?"隐藏":"显示"};
$("btnConn").onclick=goConnect;
$("pwd").onkeydown=function(e){if(e.key==="Enter")goConnect()};
$("pwd").oninput=function(){$("err").hidden=true};
$("btnRetry").onclick=goConnect;
$("btnEdit").onclick=function(){show("v2",2)};
$("btnAgain").onclick=function(){show("v1",1);scan()};
$("iconName").onchange=function(){$("iconCustom").disabled=this.value!=="custom"};
$("btnIconConvert").onclick=convertIcon;
api("/status").then(function(d){
  if(d&&d.state===2){$("dSsid").textContent=d.ssid||d.ip||"已连接";show("v4",3)}
  else{show("v1",1);scan()}
}).catch(function(){show("v1",1);scan()});
})();
</script>
